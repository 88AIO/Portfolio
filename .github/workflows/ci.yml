name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The offline suite: money math (FIFO tax, option premium, performance, dividends), CSV
      # import/export, provider config and broker normalization. Needs no secrets, and every case
      # in it pins behaviour a real bug once got wrong — so it has to gate the build, not sit
      # beside it.
      - run: npm test
      - run: npm run build
        env:
          # Public placeholders so `next build` can compile without real secrets.
          # These are dummy values, never used to reach a real project at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  rls-isolation:
    # The cross-tenant RLS test — Snowfolio's #1 security guarantee: one signed-in user must never
    # be able to read another's rows. That guarantee lives entirely in Postgres RLS policies and
    # `security_invoker` views, which cannot be tested with mocks; it needs a real database.
    #
    # It used to need three GitHub Secrets pointed at a live Supabase project, so in practice it
    # was never enabled and this job was green while verifying nothing. Instead the runner now
    # boots its own throwaway Supabase stack. No secrets exist to leak: the local stack's keys are
    # the CLI's fixed, public, documented dev constants, and the whole database is destroyed with
    # the runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # `latest` rather than a pin: a stale pin silently rots, and this stack is disposable — the
      # thing under test is our schema, not the CLI. If a CLI release ever breaks the boot, this
      # job fails loudly, which is the correct outcome for a security test.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Boot a throwaway Supabase stack
        run: supabase start

      # The schema IS the thing under test — every policy and every `security_invoker` view comes
      # from this file, so it is applied exactly as a fresh project would apply it.
      - name: Apply supabase/schema.sql
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql

      - name: Cross-tenant RLS isolation
        run: |
          eval "$(supabase status -o env)"
          # tests/rls.test.mjs SKIPS when these are unset. A skip here would put us back to a
          # green check that proves nothing, so refuse to run at all rather than pass vacuously.
          for v in API_URL ANON_KEY SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty - the local stack did not come up, refusing to report a pass"
              exit 1
            fi
          done
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" \
          NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          npm run test:rls

      - name: Tear the stack down
        if: always()
        run: supabase stop --no-backup || true
